<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>円の面積の公式をつくろう（完全結合版）</title>

</head>
<body>

    <h1>円の面積の公式をつくろう</h1>

    <div class="main-layout">
        <!-- メモ機能（サイドバー） -->
        <div class="sidebar">
            <div class="tool-group">
                <h3>🖊️ ペン機能</h3>
                <div class="color-picker">
                    <div class="color-btn active" style="background: #000000;" onclick="setPenColor('#000000', this)"></div>
                    <div class="color-btn" style="background: #e74c3c;" onclick="setPenColor('#e74c3c', this)"></div>
                    <div class="color-btn" style="background: #3498db;" onclick="setPenColor('#3498db', this)"></div>
                    <div class="color-btn" style="background: #2ecc71;" onclick="setPenColor('#2ecc71', this)"></div>
                    <div class="color-btn" style="background: #f1c40f;" onclick="setPenColor('#f1c40f', this)"></div>
                </div>
                <div class="size-picker">
                    <button id="size-1" class="active" onclick="setPenSize(2, 1)">線の太さ：細</button>
                    <button id="size-2" onclick="setPenSize(5, 2)">線の太さ：通常</button>
                    <button id="size-3" onclick="setPenSize(9, 3)">線の太さ：中</button>
                    <button id="size-4" onclick="setPenSize(14, 4)">線の太さ：太</button>
                    <button id="size-5" onclick="setPenSize(20, 5)">線の太さ：極太</button>
                </div>
            </div>

            <div class="tool-group">
                <h3>🧹 消しゴム</h3>
                <div class="action-group">
                    <button id="btn-eraser" onclick="activateEraser()">けす</button>
                    <button onclick="clearAllDrawings()">ぜんぶけす</button>
                </div>
            </div>

            <div class="tool-group">
                <h3>👁️ 表示設定</h3>
                <div class="action-group">
                    <button id="btn-toggle-bg" onclick="toggleBackgroundAlpha()">メモを透明にする</button>
                </div>
            </div>
        </div>

        <!-- メイン画面 -->
        <div class="center-area">
            <div class="controls-container">
                <div class="controls">
                    <div class="slider-title">① かたちを変える</div>
                    <div class="slider-labels"><span>円の形</span><span>ならびかえ</span></div>
                    <input type="range" id="progress-slider" min="0" max="100" value="0" oninput="onProgressMove(this.value)">
                </div>

                <div class="controls">
                    <div class="slider-title">② 分割数（なん等分か）</div>
                    <div class="slider-labels"><span>16等分</span><span id="current-parts-text" style="color:#e67e22;">16等分</span><span>500等分</span></div>
                    <input type="range" id="parts-slider" min="16" max="500" step="2" value="16" oninput="onPartsChange(this.value)">
                </div>
            </div>

            <div class="stage-container" style="width: 540px; height: 360px;">
                <canvas id="geometry-canvas" width="540" height="360"></canvas>
                <canvas id="draw-canvas" width="540" height="360"></canvas>
            </div>

            <div class="explanation">
                スライダーを動かすと、すべての三角形が<strong>隙間なく繋がったまま</strong>円から長方形へと滑らかに変形します。分割数を500等分にすると、より綺麗な長方形になります。
            </div>
        </div>
    </div>
    <script>
        const gCanvas = document.getElementById('geometry-canvas');
        const gCtx = gCanvas.getContext('2d');
        const dCanvas = document.getElementById('draw-canvas');
        const dCtx = dCanvas.getContext('2d');

        const radius = 80;    
        const circleX = 270;   
        const circleY = 180;   
        const rectCenterY = 180; 
        let currentProgress = 0; 
        let numSectors = 16;     

        let isDrawing = false;
        let penColor = '#000000';
        let penSize = 2;
        let isEraser = false;
        let isBgTransparent = false;

        // --- 改良版：図形描画システム（絶対座標の直線補間） ---
        function drawGeometry() {
            gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
            
            gCtx.fillStyle = isBgTransparent ? 'rgba(255, 255, 255, 0.4)' : '#ffffff';
            gCtx.fillRect(0, 0, gCanvas.width, gCanvas.height);

            const angleStep = (Math.PI * 2) / numSectors;
            const totalRectWidth = Math.PI * radius;
            const rectStartX = 270 - totalRectWidth / 2 + (totalRectWidth / numSectors); // 中心微調整
            const rectWidth = totalRectWidth / (numSectors / 2); 

            const p = currentProgress; 

            for (let i = 0; i < numSectors; i++) {
                const isTop = i < numSectors / 2;
                const color = isTop ? '#e74c3c' : '#2ecc71';

                // 1. 円のときの3頂点座標
                const angle1 = i * angleStep - Math.PI;
                const angle2 = (i + 1) * angleStep - Math.PI;

                const cx_circle = circleX;
                const cy_circle = circleY;
                const x1_circle = circleX + radius * Math.cos(angle1);
                const y1_circle = circleY + radius * Math.sin(angle1);
                const x2_circle = circleX + radius * Math.cos(angle2);
                const y2_circle = circleY + radius * Math.sin(angle2);

                // 2. 長方形のときの3頂点座標（噛み合わせを完全一致させる）
                let cx_rect, cy_rect, x1_rect, y1_rect, x2_rect, y2_rect;

                if (isTop) {
                    const idx = i;
                    cx_rect = rectStartX + (idx + 0.5) * rectWidth;
                    cy_rect = rectCenterY; 
                    x1_rect = rectStartX + idx * rectWidth;
                    y1_rect = rectCenterY - radius; 
                    x2_rect = rectStartX + (idx + 1) * rectWidth;
                    y2_rect = rectCenterY - radius; 
                } else {
                    const idx = i - (numSectors / 2);
                    cx_rect = rectStartX + idx * rectWidth;
                    cy_rect = rectCenterY - radius; 
                    x1_rect = rectStartX + (idx - 0.5) * rectWidth;
                    y1_rect = rectCenterY; 
                    x2_rect = rectStartX + (idx + 0.5) * rectWidth;
                    y2_rect = rectCenterY; 
                }

                // 3. 現在の進捗 p (0〜1) で座標をブレンド
                const cx = cx_circle * (1 - p) + cx_rect * p;
                const cy = cy_circle * (1 - p) + cy_rect * p;
                const x1 = x1_circle * (1 - p) + x1_rect * p;
                const y1 = y1_circle * (1 - p) + y1_rect * p;
                const x2 = x2_circle * (1 - p) + x2_rect * p;
                const y2 = y2_circle * (1 - p) + y2_rect * p;

                // 4. 描画
                gCtx.beginPath();
                gCtx.moveTo(cx, cy);
                gCtx.lineTo(x1, y1);
                gCtx.lineTo(x2, y2);
                gCtx.closePath();
                gCtx.fillStyle = color;
                gCtx.fill();

                // 隙間線を完全に消すための同色ストローク
                gCtx.strokeStyle = color;
                gCtx.lineWidth = 0.5;
                gCtx.stroke();
            }

            // 補助線と文字の表示
            if (currentProgress > 0.85) {
                gCtx.font = 'bold 13px sans-serif';
                const labelX = rectStartX - 15;
                
                gCtx.fillStyle = '#e74c3c';
                gCtx.fillText('← 半径', labelX - 55, rectCenterY - radius/2);
                gCtx.beginPath();
                gCtx.strokeStyle = '#e74c3c';
                gCtx.lineWidth = 2;
                gCtx.moveTo(labelX - 5, rectCenterY - radius);
                gCtx.lineTo(labelX - 5, rectCenterY);
                gCtx.stroke();

                gCtx.fillStyle = '#2ecc71';
                gCtx.fillText('円周の半分（直径 × 3.14 ÷ 2）', rectStartX + (totalRectWidth / 2) - 100, rectCenterY + radius + 25);
                gCtx.beginPath();
                gCtx.strokeStyle = '#2ecc71';
                gCtx.lineWidth = 2;
                gCtx.moveTo(rectStartX - rectWidth/2, rectCenterY + 5);
                gCtx.lineTo(rectStartX + totalRectWidth - rectWidth/2, rectCenterY + 5);
                gCtx.stroke();
            }
        }

        function onProgressMove(value) { currentProgress = value / 100; drawGeometry(); }
        function onPartsChange(value) {
            numSectors = parseInt(value);
            document.getElementById('current-parts-text').innerText = numSectors + '等分';
            drawGeometry();
        }

        // --- お絵描き（メモ）システム ---
        function setupDrawing() {
            dCtx.lineCap = 'round';
            dCtx.lineJoin = 'round';

            dCanvas.addEventListener('mousedown', startDrawing);
            dCanvas.addEventListener('mousemove', drawStroke);
            dCanvas.addEventListener('mouseup', stopDrawing);
            dCanvas.addEventListener('mouseleave', stopDrawing);
            
            dCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); });
            dCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); drawStroke(e.touches[0]); });
            dCanvas.addEventListener('touchend', stopDrawing);
        }

        function startDrawing(e) {
            isDrawing = true;
            dCtx.beginPath();
            const rect = dCanvas.getBoundingClientRect();
            dCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function drawStroke(e) {
            if (!isDrawing) return;
            const rect = dCanvas.getBoundingClientRect();
            dCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            
            if (isEraser) {
                dCtx.globalCompositeOperation = 'destination-out';
                dCtx.lineWidth = 20; 
            } else {
                dCtx.globalCompositeOperation = 'source-over';
                dCtx.strokeStyle = penColor;
                dCtx.lineWidth = penSize;
            }
            dCtx.stroke();
        }

        function stopDrawing() { isDrawing = false; }

        function setPenColor(color, element) {
            isEraser = false;
            penColor = color;
            document.getElementById('btn-eraser').classList.remove('active');
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function setPenSize(size, id) {
            penSize = size;
            document.querySelectorAll('.size-picker button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('size-' + id).classList.add('active');
        }

        function activateEraser() {
            isEraser = true;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-eraser').classList.add('active');
        }

        function clearAllDrawings() {
            if(confirm('かいたものをぜんぶ消します。よろしいですか？')) {
                dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height);
            }
        }

        function toggleBackgroundAlpha() {
            isBgTransparent = !isBgTransparent;
            document.getElementById('btn-toggle-bg').classList.toggle('active', isBgTransparent);
            drawGeometry();
        }

        drawGeometry();
        setupDrawing();
    </script>
</body>
</html>
